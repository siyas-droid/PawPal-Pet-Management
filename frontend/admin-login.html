
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | PawPal</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eeecff, #dcd8ff);
            font-family: Arial, sans-serif;
            color: #302d50;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 22px;
            box-shadow: 0 15px 40px #554bdc20;
            text-align: center;
        }

        .logo { font-size: 42px; }

        h1 { margin: 12px 0 8px; }

        .subtitle {
            color: #77738f;
            margin-bottom: 28px;
        }

        form {
            display: grid;
            gap: 14px;
            text-align: left;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dedbf3;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px #6c63ff20;
        }

        button {
            margin-top: 10px;
            padding: 14px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #554bdc; }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #6c63ff;
            text-decoration: none;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="logo">🐾</div>

    <h1>PawPal Admin</h1>

    <p class="subtitle">
        Sign in to manage your pet care system.
    </p>

    <form id="adminForm">

        <label for="username">Admin Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Admin Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >

        <label for="accessPassword">Admin Secret Access Password</label>
        <input
            type="password"
            id="accessPassword"
            placeholder="Enter secret access password"
            required
        >

        <button type="submit" id="loginButton">
            Login to Dashboard
        </button>

    </form>

    <p id="message"></p>

    <a class="back" href="login.html">
        ← Back to Customer Login
    </a>
</div>

<script>
const form = document.getElementById('adminForm');
const message = document.getElementById('message');
const button = document.getElementById('loginButton');

form.addEventListener('submit', async event => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = 'Logging in...';
    message.textContent = '';

    try {
        const response = await fetch(
            '/api/admin/login',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                    accessPassword: document.getElementById('accessPassword').value
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'Login failed.');
        }

        sessionStorage.setItem(
            'pawpalAdmin',
            JSON.stringify(data.admin)
        );

        window.location.href = 'admin-dashboard.html';

    } catch (error) {
        message.textContent = error.message;
        message.style.color = 'red';

    } finally {
        button.disabled = false;
        button.textContent = 'Login to Dashboard';
    }
});
</script>

</body>
</html>
