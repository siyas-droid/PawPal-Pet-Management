```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PawPal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f2;
            color: #34483a;
            min-height: 100vh;
        }

        .auth-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #e5ebe3;
            box-shadow: 0 8px 25px rgba(49, 94, 72, 0.08);
        }

        .auth-card h1 {
            color: #315e48;
            text-align: center;
            margin: 0 0 12px;
            font-size: 29px;
        }

        .auth-card > p {
            text-align: center;
            color: #788379;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #loginForm input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce5dc;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            background: #fcfdfb;
        }

        #loginForm input:focus {
            border-color: #527b60;
        }

        #loginForm button {
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #315e48;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #loginForm button:hover {
            background: #527b60;
        }

        #message {
            margin: 15px 0;
            text-align: center;
            font-size: 14px;
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #788379;
        }

        .auth-links a {
            color: #315e48;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #527b60;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 28px 20px;
            }

            .auth-card h1 {
                font-size: 25px;
            }
        }
    </style>

</head>

<body>

    <section class="auth-section">

        <div class="auth-card">

            <h1>Welcome Back! 🐶</h1>

            <p>Login to your PawPal account.</p>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <div class="auth-links">

                New to PawPal?
                <a href="register.html">Create an account</a>

            </div>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>


    <script src="../js/login.js"></script>

</body>
</html>
```
